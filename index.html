<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Support Europe Assistance Booking</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup" aria-label="Travel Support Europe">
        <img class="brand-logo" src="./assets/tse-logo.svg" alt="Travel Support Europe" />
        <div>
        <p class="eyebrow" data-i18n="app.eyebrow">24/7 assistance across Europe</p>
        <h1 data-i18n="app.title">Book assistance</h1>
        </div>
      </div>
      <label class="language-picker">
        <span data-i18n="language.label">Language</span>
        <select id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="sq">Albanian</option>
          <option value="bs">Bosnian</option>
          <option value="bg">Bulgarian</option>
          <option value="ca">Catalan</option>
          <option value="hr">Croatian</option>
          <option value="cs">Czech</option>
          <option value="da">Danish</option>
          <option value="nl">Dutch</option>
          <option value="et">Estonian</option>
          <option value="fi">Finnish</option>
          <option value="de">Deutsch</option>
          <option value="de-AT">Austrian German</option>
          <option value="fr">Francais</option>
          <option value="el">Greek</option>
          <option value="hu">Hungarian</option>
          <option value="is">Icelandic</option>
          <option value="ga">Irish</option>
          <option value="it">Italian</option>
          <option value="lv">Latvian</option>
          <option value="lt">Lithuanian</option>
          <option value="mk">Macedonian</option>
          <option value="mt">Maltese</option>
          <option value="no">Norwegian</option>
          <option value="pl">Polish</option>
          <option value="pt">Portuguese</option>
          <option value="ro">Romanian</option>
          <option value="ru">Russian</option>
          <option value="sr">Serbian</option>
          <option value="sk">Slovak</option>
          <option value="sl">Slovenian</option>
          <option value="es">Spanish</option>
          <option value="sv">Svenska</option>
          <option value="tr">Turkish</option>
          <option value="uk">Ukrainian</option>
        </select>
      </label>
    </header>

    <main class="booking-layout">
      <section class="booking-panel">
        <p class="eyebrow" data-i18n="booking.eyebrow">Travel Support Europe</p>
        <h2 data-i18n="booking.title">Book assistance</h2>
        <p class="booking-copy" data-i18n="booking.description">
          Roadside assistance for travellers across Europe.
        </p>
        <button id="openBooking" class="booking-button" data-i18n="booking.open">
          Start booking
        </button>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
