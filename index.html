<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Support Europe Assistance Booking</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup" aria-label="Travel Support Europe">
        <img class="brand-logo" src="./assets/tse-logo.svg" alt="Travel Support Europe" />
        <div>
        <p class="eyebrow" data-i18n="app.eyebrow">24/7 assistance across Europe</p>
        <h1 data-i18n="app.title">Book assistance</h1>
        </div>
      </div>
      <label class="language-picker">
        <span data-i18n="language.label">Language</span>
        <select id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="de-AT">Deutsch (Österreich)</option>
          <option value="fr">Français</option>
          <option value="nl">Nederlands</option>
          <option value="sv">Svenska</option>
        </select>
      </label>
    </header>

    <main class="booking-layout">
      <section class="booking-panel">
        <p class="eyebrow" data-i18n="booking.eyebrow">Travel Support Europe</p>
        <h2 data-i18n="booking.title">Book assistance</h2>
        <p class="booking-copy" data-i18n="booking.description">
          Roadside assistance for travellers across Europe.
        </p>
        <button id="openBooking" class="booking-button" data-i18n="booking.open">
          Start booking
        </button>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
