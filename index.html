<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Support Europe Assistance Booking</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup" aria-label="Travel Support Europe">
        <img class="brand-logo" src="./assets/tse-logo.svg" alt="Travel Support Europe" />
        <div>
        <p class="eyebrow" data-i18n="app.eyebrow">24/7 assistance across Europe</p>
        <h1 data-i18n="app.title">Book assistance</h1>
        </div>
      </div>
      <label class="language-picker">
        <span data-i18n="language.label">Language</span>
        <select id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="sq">Shqip</option>
          <option value="bs">Bosanski</option>
          <option value="bg">Български</option>
          <option value="ca">Català</option>
          <option value="hr">Hrvatski</option>
          <option value="cs">Čeština</option>
          <option value="da">Dansk</option>
          <option value="nl">Nederlands</option>
          <option value="et">Eesti</option>
          <option value="fi">Suomi</option>
          <option value="de">Deutsch</option>
          <option value="de-AT">Deutsch (Österreich)</option>
          <option value="fr">Français</option>
          <option value="el">Ελληνικά</option>
          <option value="hu">Magyar</option>
          <option value="is">Íslenska</option>
          <option value="ga">Gaeilge</option>
          <option value="it">Italiano</option>
          <option value="lv">Latviešu</option>
          <option value="lt">Lietuvių</option>
          <option value="mk">Македонски</option>
          <option value="mt">Malti</option>
          <option value="no">Norsk</option>
          <option value="pl">Polski</option>
          <option value="pt">Português</option>
          <option value="ro">Română</option>
          <option value="ru">Русский</option>
          <option value="sr">Српски</option>
          <option value="sk">Slovenčina</option>
          <option value="sl">Slovenščina</option>
          <option value="es">Español</option>
          <option value="sv">Svenska</option>
          <option value="tr">Türkçe</option>
          <option value="uk">Українська</option>
        </select>
      </label>
    </header>

    <main class="booking-layout">
      <section class="booking-panel">
        <p class="eyebrow" data-i18n="booking.eyebrow">Travel Support Europe</p>
        <h2 data-i18n="booking.title">Book assistance</h2>
        <p class="booking-copy" data-i18n="booking.description">
          Roadside assistance for travellers across Europe.
        </p>
        <button id="openBooking" class="booking-button" data-i18n="booking.open">
          Start booking
        </button>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
